services:
  - type: web
    name: freelance-manager
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3500
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: freelance-db
          property: connectionString

databases:
  - name: freelance-db
    plan: free
    databaseName: freelance_manager
    user: freelance_user
